name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Pure Dart, no platform channels and no bundled tooling, so one runner
      # covers all three targets. The suite guards the disk-selection and
      # flash-safety paths, which is where a wrong answer costs somebody their
      # drive, so the builds below wait on it.
      - name: Run tests
        run: flutter test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to 22.04 (glibc 2.35) rather than ubuntu-latest so the
          # tar.gz and AppImage run on older distros. glibc is not bundled,
          # so this host's glibc is the minimum the artifacts support.
          - os: ubuntu-22.04
            target: linux-x64
            platform: linux
            arch: x64
          - os: macos-latest
            target: macos
            platform: macos
            arch: universal
          - os: windows-latest
            target: windows
            platform: windows
            arch: x64

    # The `secrets` context is not available in step-level `if:` conditions,
    # so surface the signing secrets as booleans here and gate on `env`.
    # Signing needs both halves, the certificate to import and the team id that
    # names the identity, so gate on them together: importing a certificate no
    # step can then use, or running codesign against an identity that was never
    # imported, fails the job just as hard as no gate at all.
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: echo "describe=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            librsvg2-dev \
            libgdk-pixbuf2.0-dev \
            desktop-file-utils \
            file

      - name: Fetch flasher binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < assets/tools/FLASHER_VERSION)"
          echo "Fetching librescoot-flasher $TAG into assets/tools/"
          cd assets/tools
          # Host flashers for this target + linux-arm (always, for on-device MDB flash).
          # macOS takes both CPUs: the .app is universal, so an Intel Mac runs an
          # x86_64 process and looks for the amd64 binary. Shipping only arm64
          # sent those hosts into an unprivileged dd on /dev/rdiskN, which can
          # only end in "Permission denied" with no prompt to answer.
          case "${{ matrix.target }}" in
            macos)      HOST_ASSETS=(librescoot-flasher-darwin-arm64 librescoot-flasher-darwin-amd64) ;;
            linux-x64)  HOST_ASSETS=(librescoot-flasher-linux-amd64) ;;
            windows)    HOST_ASSETS=(librescoot-flasher-windows-amd64.exe) ;;
          esac
          PATTERNS=()
          for asset in "${HOST_ASSETS[@]}"; do PATTERNS+=(--pattern "$asset"); done
          gh release download "$TAG" --repo librescoot/librescoot-flasher \
            "${PATTERNS[@]}" \
            --pattern librescoot-flasher-linux-arm
          chmod +x librescoot-flasher-*
          # Drop tooling that isn't used by this target
          if [ "${{ matrix.target }}" != "windows" ]; then
            rm -f dd.exe
          fi

      - name: Refresh bundled latest.json fallback
        shell: bash
        run: |
          # Best-effort: bundle a fresh release manifest with the build so
          # the installer can show channel choices even when the user's
          # network is offline / TLS-flaky on first run. Falls back to
          # whatever is already committed if downloads.librescoot.org is
          # unreachable from CI.
          curl -fsSL --retry 3 --retry-delay 2 \
            -o assets/latest.json.fallback \
            https://downloads.librescoot.org/releases/latest.json \
            || echo "warning: latest.json fetch failed, keeping committed snapshot"
          ls -l assets/latest.json.fallback

      # Signing, notarization and stapling are skipped when their secrets are
      # absent, so forks (and PRs from forks) still produce an unsigned but
      # runnable build instead of failing the whole macOS job.
      - name: Import signing certificate
        if: matrix.target == 'macos' && env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE" | base64 -d > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          rm "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release --dart-define=AUTH_KEY=${{ secrets.AUTH_KEY }} --dart-define=APP_VERSION=${{ steps.version.outputs.describe }}

      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release --dart-define=AUTH_KEY=${{ secrets.AUTH_KEY }} --dart-define=APP_VERSION=${{ steps.version.outputs.describe }}

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release --dart-define=AUTH_KEY=${{ secrets.AUTH_KEY }} --dart-define=APP_VERSION=${{ steps.version.outputs.describe }}

      - name: Sign macOS app
        if: matrix.target == 'macos' && env.HAS_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/macos/Build/Products/Release/Librescoot Installer.app"
          IDENTITY="Developer ID Application: Starsong GmbH ($APPLE_TEAM_ID)"
          ENTITLEMENTS="macos/Runner/Release.entitlements"

          # Sign every Mach-O inside the bundle bottom-up (dylibs, frameworks,
          # nested helpers, bundled flasher binary). Non-Mach-O files (e.g. the
          # linux-arm flasher) are skipped — notarization only checks Mach-O.
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$f"
            fi
          done

          # Sign frameworks (directory bundles)
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' | while read -r fw; do
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$fw"
            done
          fi

          # Sign the app bundle itself with entitlements
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$IDENTITY" \
            "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package macOS (DMG)
        if: matrix.target == 'macos'
        run: |
          VERSION="${{ steps.version.outputs.describe }}"
          DMG_DIR=$(mktemp -d)
          cp -R "build/macos/Build/Products/Release/Librescoot Installer.app" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "Librescoot Installer" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "build/macos/Build/Products/Release/librescoot-installer-macos-universal-${VERSION}.dmg"
          rm -rf "$DMG_DIR"

      - name: Notarize and staple DMG
        if: matrix.target == 'macos' && env.HAS_SIGNING == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY" | base64 -d > "$KEY_PATH"

          DMG=$(ls build/macos/Build/Products/Release/librescoot-installer-macos-*.dmg)
          echo "Notarizing $DMG"

          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          rm "$KEY_PATH"

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          chmod +x linux/packaging/build-appimage.sh
          linux/packaging/build-appimage.sh "${{ steps.version.outputs.describe }}"

      - name: Package Linux (tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd build/linux/x64/release
          mv bundle librescoot-installer
          tar czf librescoot-installer-linux-x64-${{ steps.version.outputs.describe }}.tar.gz librescoot-installer/

      - name: Package Windows (zip)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          cd build/windows/x64/runner
          mv Release librescoot-installer
          7z a librescoot-installer-windows-x64-${{ steps.version.outputs.describe }}.zip librescoot-installer/

      - name: Package Windows (portable single-file exe)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.describe }}"
          # Derive a clean X.Y.Z.0 for VIProductVersion. Strips a leading 'v'
          # and any -N-gSHA / -dirty suffix from `git describe`. Falls back to
          # 0.0.0.0 for branch builds where the version isn't a clean tag.
          if ($version -match '^v?(\d+)\.(\d+)\.(\d+)') {
            $numeric = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            $numeric = "0.0.0.0"
          }
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          $buildDir = "$PWD\build\windows\x64\runner\librescoot-installer"
          $outFile  = "$PWD\build\windows\x64\runner\librescoot-installer-windows-x64-$version.exe"
          & $makensis /V2 `
            "/DPRODUCT_VERSION=$version" `
            "/DNUMERIC_VERSION=$numeric" `
            "/DBUILD_DIR=$buildDir" `
            "/DOUT_FILE=$outFile" `
            windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed (exit $LASTEXITCODE)" }
          Get-Item $outFile | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: librescoot-installer-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.version.outputs.describe }}
          path: |
            build/macos/Build/Products/Release/librescoot-installer-*.dmg
            build/linux/x64/release/librescoot-installer-*.tar.gz
            build/linux/x64/release/librescoot-installer-*.AppImage
            build/windows/x64/runner/librescoot-installer-*.zip
            build/windows/x64/runner/librescoot-installer-*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p dist/
          find artifacts/ -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Generate release notes
        run: |
          chmod +x scripts/changelog.sh
          scripts/changelog.sh --to "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            | tee release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          # Hyphenated tags (v1.2.3-beta.1) are prereleases: hidden from
          # /releases/latest, so the downloads site and installers never
          # pick them up as the current version.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Generate app token for site rebuilds
        if: ${{ !contains(github.ref_name, '-') }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: librescoot
          repositories: downloads.librescoot.org,librescoot.github.io

      - name: Trigger downloads site rebuild
        if: ${{ !contains(github.ref_name, '-') }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/downloads.librescoot.org
          event-type: releases-changed

      - name: Trigger main site rebuild
        if: ${{ !contains(github.ref_name, '-') }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/librescoot.github.io
          event-type: releases-changed
