            - text: Wir haben den Installer auf allen Plattformen mit echter Hardware getestet, trotzdem kann etwas schiefgehen. Im schlimmsten Fall ist dein Roller ohne tiefergehenden Eingriff nicht mehr nutzbar. Verwendung auf eigene Gefahr. Für Support versuch's auf
            - link "Discord" [ref=e39] [cursor=pointer]:
